name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Dependencias de Qt para render sin pantalla
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Humo de QML (carga la interfaz sin pantalla)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          themevault-gui --root /tmp/vault --screenshot /tmp/gui.png
          test -s /tmp/gui.png

      - name: CLI
        run: |
          themevault --version
          themevault --root /tmp/vault detect
          themevault --root /tmp/vault list

  package:
    name: empaquetado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: El wheel incluye la interfaz
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          qml = [n for n in names if n.endswith(".qml")]
          assert "themevault/ui/qml/Main.qml" in names, "falta Main.qml en el wheel"
          print(f"{len(qml)} archivos QML dentro del wheel")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
