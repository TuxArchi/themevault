name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ej. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: construir y publicar
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            librsvg2-bin file

      - name: Python y empaquetado
        run: |
          python -m pip install --upgrade pip
          pip install build 'PySide6-Essentials>=6.6' 'Pillow>=10' pyinstaller

      - name: sdist + wheel
        run: python -m build

      - name: AppImage
        run: bash packaging/appimage/build.sh

      - name: Verificar el AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APPIMAGE=$(ls dist/*.AppImage)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --version
          "$APPIMAGE" --root /tmp/vault --screenshot /tmp/app.png
          test -s /tmp/app.png

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.AppImage
          generate_release_notes: true
          body: |
            Respaldo y restauración de la personalización del escritorio Linux
            (KDE Plasma, GNOME y Xfce).

            **Instalación rápida**

            1. Descargá `ThemeVault-x86_64.AppImage`, dale permisos y ejecutalo:
               ```bash
               chmod +x ThemeVault-*.AppImage
               ./ThemeVault-*.AppImage
               ```
            2. O instalá el wheel:
               ```bash
               pip install themevault-*.whl 'themevault[gui]'
               ```

            **Apoyá el proyecto** — si te ahorra tiempo, invitame un café:
            https://ko-fi.com/tuxarchi
