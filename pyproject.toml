[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "themevault"
version = "0.8.0"
description = "Respaldo y restauracion de la personalizacion del escritorio Linux (KDE, GNOME, Xfce, Cinnamon, MATE, Budgie, LXQt, COSMIC, Hyprland, niri, Sway, River, Wayfire, labwc)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "TuxArchi" }]
keywords = [
    "linux",
    "desktop",
    "theme",
    "backup",
    "restore",
    "kde",
    "plasma",
    "gnome",
    "xfce",
    "hyprland",
    "niri",
    "sway",
    "river",
    "wayfire",
    "labwc",
    "cinnamon",
    "mate",
    "budgie",
    "lxqt",
    "i3",
    "openbox",
    "cosmic",
    "wayland",
    "qt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6", "Pillow>=10"]
images = ["Pillow>=10"]
dev = ["pytest>=8", "build>=1.0", "pyinstaller>=6.0"]

[project.urls]
Homepage = "https://tuxarchi.github.io/themevault/"
Repository = "https://github.com/TuxArchi/themevault"
Issues = "https://github.com/TuxArchi/themevault/issues"
Changelog = "https://github.com/TuxArchi/themevault/blob/main/CHANGELOG.md"
Funding = "https://ko-fi.com/tuxarchi"

[project.scripts]
themevault = "themevault.cli:main"
themevault-gui = "themevault.ui.app:main"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
themevault = ["ui/qml/*", "ui/qml/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
